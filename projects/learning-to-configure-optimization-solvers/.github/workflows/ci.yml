name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest
      - name: Smoke experiment
        run: solverconfig benchmark --config configs/smoke.json --output results/ci-smoke
      - name: Validate smoke outputs
        run: test -s results/ci-smoke/summary.json && test -s results/ci-smoke/metrics.csv && test -s results/ci-smoke/raw_results.jsonl
