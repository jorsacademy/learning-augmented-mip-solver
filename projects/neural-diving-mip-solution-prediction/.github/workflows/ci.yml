name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest

  research-smoke:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Train deterministic solution predictor
        run: >-
          python scripts/train.py
          --seed 42 --train-instances 20 --validation-instances 8
          --items 20 --constraints 4 --epochs 80
          --out artifacts/predictor.pt
          --metrics-out artifacts/training_metrics.json
      - name: Benchmark held-out partial fixing
        run: >-
          python scripts/benchmark.py
          --model artifacts/predictor.pt --seed 9000 --instances 8
          --items 24 --constraints 5 --stochastic-samples 2
          --output artifacts/benchmark.json
      - uses: actions/upload-artifact@v6
        with:
          name: neural-diving-smoke-artifacts
          path: artifacts/*
