[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-to-prune-bnb-node-selection"
version = "0.1.0"
description = "Imitation learning for branch-and-bound node selection and explicitly approximate learned pruning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "JORS Academy Non-Commercial Source License 1.0"}
authors = [{name = "Jors Academy"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
